delete rows/columns under computational invariance","children":[],"payload":{"tag":"li","lines":"2151,2152"}},{"content":"SliceGPT is a post-training structured pruning method that applies an orthogonal transform (computational invariance) and slices entire rows and columns of weight matrices","children":[],"payload":{"tag":"li","lines":"2152,2153"}},{"content":"reducing the embedding dimension while keeping competitive accuracy without recovery fine-tuning","children":[],"payload":{"tag":"li","lines":"2153,2154"}}],"payload":{"tag":"li","lines":"2150,2154"}},{"content":"Method family &#x2014; pruning","children":[],"payload":{"tag":"li","lines":"2154,2155"}},{"content":"Training-free &#x2014; yes","children":[],"payload":{"tag":"li","lines":"2155,2156"}},{"content":"Hardware","children":[{"content":"H100 80GB","children":[],"payload":{"tag":"li","lines":"2157,2158"}},{"content":"A100 40GB","children":[],"payload":{"tag":"li","lines":"2158,2159"}},{"content":"Quadro RTX6000 24GB","children":[],"payload":{"tag":"li","lines":"2159,2160"}},{"content":"V100 32GB","children":[],"payload":{"tag":"li","lines":"2160,2161"}}],"payload":{"tag":"li","lines":"2156,2161"}},{"content":"Speedup","children":[{"content":"1.55x vs FP16 dense LLaMA-2 70B (541 tokens/s on 2x H100) on 80GB H100","children":[],"payload":{"tag":"li","lines":"2162,2163"}}],"payload":{"tag":"li","lines":"2161,2163"}},{"content":"Models","children":[{"content":"OPT-125M","children":[{"content":"Method / OPT / LLAMA-2 / 125M / 1.3B / 2.7B / 6.7B / 13B / 30B / 66B / 7B / 13B / 70B","children":[],"payload":{"tag":"li","lines":"2165,2166"}}],"payload":{"tag":"li","lines":"2164,2166"}},{"content":"OPT-1.3B","children":[{"content":"125M / 1.3B / 2.7B / 6.7B / 13B / 30B / 66B","children":[],"payload":{"tag":"li","lines":"2167,2168"}}],"payload":{"tag":"li","lines":"2166,2168"}},{"content":"OPT-2.7B","children":[{"content":"125M / 1.3B / 2.7B / 6.7B / 13B / 30B / 66B","children":[],"payload":{"tag":"li","lines":"216 hildren":[],"payload":{"tag":"li","lines":"3659,3660"}},{"content":"The LAMBADA dataset: Word prediction requiring a broad discourse context","children":[],"payload":{"tag":"li","lines":"3660,3661"}}],"payload":{"tag":"li","lines":"3658,3661"}},{"content":"Contribution","children":[{"content":"long-context word prediction","children":[],"payload":{"tag":"li","lines":"3662,3663"}},{"content":"Introduces LAMBADA","children":[],"payload":{"tag":"li","lines":"3663,3664"}},{"content":"a word prediction benchmark of 10,022 narrative passages where the last word is guessable only with broad discourse context","children":[],"payload":{"tag":"li","lines":"3664,3665"}},{"content":"not the final sentence alone","children":[],"payload":{"tag":"li","lines":"3665,3666"}}],"payload":{"tag":"li","lines":"3661,3666"}},{"content":"Dataset","children":[{"content":"LAMBADA","children":[{"content":"The LAMBADA dataset consists of 10,022 passages","children":[],"payload":{"tag":"li","lines":"3668,3669"}},{"content":"divided into 4,869 development and 5,153 test passages","children":[],"payload":{"tag":"li","lines":"3669,3670"}}],"payload":{"tag":"li","lines":"3667,3670"}},{"content":"BookCorpus","children":[{"content":"The LAMBADA data come from the Book Corpus (Zhu et al., 2015)","children":[],"payload":{"tag":"li","lines":"3671,3672"}}],"payload":{"tag":"li","lines":"3670,3672"}},{"content":"Control set","children":[{"content":"This control set was constructed by randomly sampling 5K passages of the same shape and size as the ones used to build LAMBADA from the same test novels","children":[],"payload":{"tag":"li","lines":"3673,3674"}}],"payload":{"tag":"li","lines":"3672,3674"}}],"payload":{"tag":"li","lines":"3666,3674"}},{"content":"Data Size","children":[{"content":"10,022 passages (4,869 dev + 5,153 test)","children":[],"payload":{"tag":"li","lines":"3675,3676"}},{"content":"training corpus of 2,662 novels with 203 million words","children":[],"payload":{"tag":"li","lines":"3676,3 ren":[],"payload":{"tag":"li","lines":"3695,3696"}},{"content":"Median Rank = 87 &#x2014; on LAMBADA","children":[],"payload":{"tag":"li","lines":"3696,3697"}},{"content":"Max Accuracy (%) across tested models = 1 &#x2014; on LAMBADA","children":[],"payload":{"tag":"li","lines":"3697,3698"}}],"payload":{"tag":"li","lines":"3689,3698"}},{"content":"N-Gram with cache","children":[{"content":"a traditional statistical N-Gram language model (Stolcke, 2002) with and without cache","children":[],"payload":{"tag":"li","lines":"3699,3700"}},{"content":"Accuracy (%) = 0.1 &#x2014; on LAMBADA","children":[],"payload":{"tag":"li","lines":"3700,3701"}},{"content":"Perplexity = 3125 &#x2014; on LAMBADA","children":[],"payload":{"tag":"li","lines":"3701,3702"}},{"content":"Median Rank = 993 &#x2014; on LAMBADA","children":[],"payload":{"tag":"li","lines":"3702,3703"}},{"content":"Perplexity = 768 &#x2014; on LAMBADA","children":[],"payload":{"tag":"li","lines":"3703,3704"}},{"content":"Accuracy (%) = 0.1 &#x2014; on LAMBADA","children":[],"payload":{"tag":"li","lines":"3704,3705"}},{"content":"Median Rank = 87 &#x2014; on LAMBADA","children":[],"payload":{"tag":"li","lines":"3705,3706"}},{"content":"Max Accuracy (%) across tested models = 1 &#x2014; on LAMBADA","children":[],"payload":{"tag":"li","lines":"3706,3707"}}],"payload":{"tag":"li","lines":"3698,3707"}},{"content":"Memory Network","children":[{"content":"Accuracy (%) = 0 &#x2014; on LAMBADA","children":[],"payload":{"tag":"li","lines":"3708,3709"}},{"content":"Perplexity = 16318 &#x2014; on LAMBADA","children":[],"payload":{"tag":"li","lines":"3709,3710"}},{"content":"Median Rank = 846 &#x2014; on LAMBADA","children":[],"payload":{"tag":"li","lines":"3710,3711"}},{"content":"Max Accuracy (%) across tested models = 1 &#x2014; on LAMBADA","children":[],"payload":{"tag":"li","lines":"3711,3712"}}],"payload":{"tag":"li","lines":"3707,3712"}},{"content":"Sup-CBOW","children":[{"content":"we constructed Sup-CBOW","children":[],"payload":{"tag":"li","lines":"3713,3714"}},{"content":"a baseline model weakly tailored to the task at hand","children":[],"payload":{"tag":"li","lines":"3714,3715"}},{"content":"consisting of a simple neural network","children":[],"payload":{"tag":"li","lines":"3715,3716"}},{"content":"Accuracy (%) = 0 &#x2014; on LAMBADA","children":[],"payload":{"tag":"li","lines":"3716,3717"}},{"content":"Perplexity = 57040 &#x2014; on LAMBADA","children":[],"payload":{"tag":"li","lines":"3717,3718"}},{"content":"Median Rank = 16352 &#x2014; on LAMBADA","children":[],"payload":{"tag":"li","lines":"3718,3719"}},{"content":"Accuracy (%) = 0 &#x2014; on LAMBADA","children":[],"payload":{"tag":"li","lines":"3719,3720"}},{"content":"Perplexity = 47587 &#x2014; on LAMBADA","children":[],"payload":{"tag":"li","lines":"3720,3721"}},{"content":"Median Rank = 4660 &#x2014; on LAMBADA","children":[],"payload":{"tag":"li","lines":"3721,3722"}}],"payload":{"tag":"li","lines":"3712,3722"}},{"content":"Unsup-CBOW","children":[{"content":"We also considered an unsupervised variant (Unsup-CBOW) where the target word is predicted by cosine similarity","children":[],"payload":{"tag":"li","lines":"3723,3724"}},{"content":"Accuracy (%) = 0 &#x2014; on LAMBADA","children":[],"payload":{"tag":"li","lines":"3724,3725"}},{"content":"Perplexity = 57040 &#x2014; on LAMBADA","children":[],"payload":{"tag":"li","lines":"3725,3726"}},{"content":"Median Rank = 16352 &#x2014; on LAMBADA","children":[],"payload":{"tag":"li","lines":"3726,3727"}},{"content":"Accuracy (%) = 0 &#x2014; on LAMBADA","children":[],"payload":{"tag":"li","lines":"3727,3728"}},{"content":"Perplexity = 47587 &#x2014; on LAMBADA","children":[],"payload":{"tag":"li","lines":"3728,3729"}},{"content":"Median Rank = 4660 &#x2014; on LAMBADA","children":[],"payload":{"tag":"li","lines":"3729,3730"}}],"payload":{"tag":"li","lines":"3722,3730"}}],"payload":{"tag":"li","lines":"3678,3730"}},{"content":"Metric definition","children":[{"content":"Accuracy","children":[{"content":"the measure of interest for LAMBADA is the average success of a model at predicting the target word","children":[],"payload":{"tag":"li","lines":"3732,3733"}},{"content":"i.e","children":[],"payload":{"tag":"li","lines":"3733,3734"}},{"content":"accuracy","children":[],"payload":{"tag":"li","lines":"3734,3735"}}],"payload":{"tag":"li","lines":"3731,3735"}},{"content":"Perplexity","children":[{"content":"as we observe a bottoming effect with accuracy","children":[],"payload":{"tag":"li","lines":"3736,3737"}},{"content":"we also report perplexity and median rank of correct word","children":[],"payload":{"tag":"li","lines":"3737,3738"}}],"payload":{"tag":"li","lines":"3735,3738"}},{"content":"Median rank of correct word","children":[{"content":"we also report perplexity and median rank of correct word","children":[],"payload":{"tag":"li","lines":"3739,3740"}},{"content":"to better compare the models","children":[],"payload":{"tag":"li","lines":"3740,3741"}}],"payload":{"tag":"li","lines":"3738,3741"}}],"payload":{"tag":"li","lines":"3730,3741"}},{"content":"Limitations","children":[{"content":"Single language only: LAMBADA covers English narrative fiction","children":[{"content":"with no multilingual or multi-domain coverage","children":[],"payload":{"tag":"li","lines":"3743,3744"}}],"payload":{"tag":"li","lines":"3742,3744"}},{"content":"Skews heavily toward proper nouns (48% of targets)","children":[{"content":"so the benchmark partly tests co-reference rather than full discourse reasoning","children":[],"payload":{"tag":"li","lines":"3745,3746"}}],"payload":{"tag":"li","lines":"3744,3746"}},{"content":"Reports no statistical confidence intervals","children":[{"content":"no inter-annotator agreement scores","children":[],"payload":{"tag":"li","lines":"3747,3748"}},{"content":"and no multiple training seeds for the model results","children":[],"payload":{"tag":"li","lines":"3748,3749"}}],"payload":{"tag":"li","lines":"3746,3749"}},{"content":"Does not evaluate any modern (post-2016) Transformer or large pretrained model","children":[{"content":"only classic RNN","children":[],"payload":{"tag":"li","lines":"3750,3751"}},{"content":"LSTM","children":[],"payload":{"tag":"li","lines":"3751,3752"}},{"content":"n-gram","children":[],"payload":{"tag":"li","lines":"3752,3753"}},{"content":"and Memory Network baselines","children":[],"payload":{"tag":"li","lines":"3753,3754"}}],"payload":{"tag":"li","lines":"3749,3754"}}],"payload":{"tag":"li","lines":"3741,3754"}}],"payload":{"tag":"li","lines":"3656,3754"}},{"content":"RP03 &#x2014; Mihaylov et al. 2018 &#x2014; OpenBookQA &#x2014; multi-choice elementary science","children":[{"content":"Year &#x2014; 2018","children":[],"payload":{"tag":"li","lines":"3755,3756"}},{"content":"Paper","children":[{"content":"Mihaylov","children":[],"payload":{"tag":"li","lines":"3757,3758"}},{"content":"Can a Suit of Armor Conduct Electricity? A New Dataset for Open Book Question Answering","children":[],"payload":{"tag":"li","lines":"3758,3759"}}],"payload":{"tag":"li","lines":"3756,3759"}},{"content":"Contribution","children":[{"content":"multi-choice elementary science","children":[],"payload":{"tag":"li","lines":"3760,3761"}},{"content":"OpenBookQA is a new 5,957-question multiple-choice QA benchmark paired with a 1,326-fact open book of elementary science","children":[],"payload":{"tag":"li","lines":"3761,3762"}},{"content":"requiring multi-hop reasoning that combines a core fact with broad common knowledge","children":[],"payload":{"tag":"li","lines":"3762,3763"}}],"payload":{"tag":"li","lines":"3759,3763"}},{"content":"Dataset","children":[{"content":"OpenBookQA","children":[{"content":"The OpenBookQA dataset consists of about 6,000 4-way multiple-choice questions","children":[],"payload":{"tag":"li","lines":"3765,3766"}},{"content":"each associated with one core fact from a &quot;book&quot; F of 1326 such facts","children":[],"payload":{"tag":"li","lines":"3766,3767"}}],"payload":{"tag":"li","lines":"3764,3767"}},{"content":"F: 1,326 elementary science facts","children":[{"content":"For F","children":[],"payload":{"tag":"li","lines":"3768,3769"}},{"content":"we use a subset of the WorldTree corpus which Jansen et al","children":[],"payload":{"tag":"li","lines":"3769,3770"}},{"content":"(2018) have analyzed for sufficiency for elementary level science","children":[],"payload":{"tag":"li","lines":"3770,3771"}},{"content":"The subset we use is taken from the 2287 WorldTree facts that were marked as &quot;central&quot;","children":[],"payload":{"tag":"li","lines":"3771,3772"}}],"payload":{"tag":"li","lines":"3767,3772"}},{"content":"K: ~6,000 auxiliary common-knowledge facts","children":[{"content":"We thus include in OpenBookQA the set K of such second facts only as auxiliary data for optional use","children":[],"payload":{"tag":"li","lines":"3773,3774"}},{"content":"We emphasize that K should not be viewed as &apos;gold&apos; additional facts","children":[],"payload":{"tag":"li","lines":"3774,3775"}}],"payload":{"tag":"li","lines":"3772,3775"}},{"content":"ConceptNet","children":[{"content":"adding ConceptNet (Speer et al., 2017) introduces a distraction and reduces the score","children":[],"payload":{"tag":"li","lines":"3776,3777"}}],"payload":{"tag":"li","lines":"3775,3777"}},{"content":"WordNet","children":[{"content":"When we also include facts retrieved from WordNet (Miller et al., 1990)","children":[],"payload":{"tag":"li","lines":"3778,3779"}},{"content":"the score improves by about 0.5%","children":[],"payload":{"tag":"li","lines":"3779,3780"}}],"payload":{"tag":"li","lines":"3777,3780"}}],"payload":{"tag":"li","lines":"3763,3780"}},{"content":"Data Size","children":[{"content":"5,957 multiple-choice questions split 4,957/500/500 for Train/Dev/Test","children":[],"payload":{"tag":"li","lines":"3781,3782"}},{"content":"1,326 core science facts","children":[],"payload":{"tag":"li","lines":"3782,3783"}},{"content":"~6,000 auxiliary K facts","children":[],"payload":{"tag":"li","lines":"3783,3784"}}],"payload":{"tag":"li","lines":"3780,3784"}},{"content":"Models","children":[{"content":"PMI","children":[{"content":"PMI (Clark et al., 2016) uses pointwise mutual information (PMI) to score each answer choice using statistics based on a corpus of 280 GB of plain text","children":[],"payload":{"tag":"li","lines":"3786,3787"}},{"content":"Accuracy = 19.7 &#x2014; on OpenBookQA-Dev &#x2014; vs Guess All 25","children":[],"payload":{"tag":"li","lines":"3787,3788"}},{"content":"Accuracy = 21.2 &#x2014; on OpenBookQA-Test &#x2014; vs Guess All 25","children":[],"payload":{"tag":"li","lines":"3788,3789"}}],"payload":{"tag":"li","lines":"3785,3789"}},{"content":"TableILP","children":[{"content":"TableILP (Khashabi et al., 2016) is an Integer Linear Programming (ILP) based reasoning system designed for science questions","children":[],"payload":{"tag":"li","lines":"3790,3791"}},{"content":"Accuracy = 20 &#x2014; on OpenBookQA-Dev &#x2014; vs Guess All 25","children":[],"payload":{"tag":"li","lines":"3791,3792"}},{"content":"Accuracy = 23.4 &#x2014; on OpenBookQA-Test &#x2014; vs Guess All 25","children":[],"payload":{"tag":"li","lines":"3792,3793"}},{"content":"Coverage (no answer rate) = 24 &#x2014; on OpenBookQA","children":[],"payload":{"tag":"li","lines":"3793,3794"}}],"payload":{"tag":"li","lines":"3789,3794"}},{"content":"TupleInference","children":[{"content":"TupleInference (Khot et al., 2017)","children":[],"payload":{"tag":"li","lines":"3795,3796"}},{"content":"also an ILP-based QA system","children":[],"payload":{"tag":"li","lines":"3796,3797"}},{"content":"uses Open IE tuples (Banko et al., 2007) as its semi-structured representation","children":[],"payload":{"tag":"li","lines":"3797,3798"}},{"content":"Accuracy = 15.9 &#x2014; on OpenBookQA-Dev &#x2014; vs Guess All 25","children":[],"payload":{"tag":"li","lines":"3798,3799"}},{"content":"Accuracy = 17.9 &#x2014; on OpenBookQA-Test &#x2014; vs Guess All 25","children":[],"payload":{"tag":"li","lines":"3799,3800"}},{"content":"Accuracy = 23.6 &#x2014; on OpenBookQA-Dev &#x2014; vs TupleInference 15.9","children":[],"payload":{"tag":"li","lines":"3800,3801"}}],"payload":{"tag":"li","lines":"3794,3801"}},{"content":"DGEM","children":[{"content":"DGEM (Khot et al., 2018) is a neural entailment model that also uses Open IE to produce a semi-structured representation","children":[],"payload":{"tag":"li","lines":"3802,3803"}},{"content":"Accuracy = 27.4 &#x2014; on OpenBookQA-Dev &#x2014; vs Guess All 25","children":[],"payload":{"tag":"li","lines":"3803,3804"}},{"content":"Accuracy = 24.4 &#x2014; on OpenBookQA-Test &#x2014; vs Guess All 25","children":[],"payload":{"tag":"li","lines":"3804,3805"}},{"content":"Accuracy = 28.2 &#x2014; on OpenBookQA-Dev &#x2014; vs DGEM 27.4","children":[],"payload":{"tag":"li","lines":"3805,3806"}}],"payload":{"tag":"li","lines":"3801,3806"}},{"content":"IR solver","children":[{"content":"We also consider providing the set F of core facts to two existing solvers: the IR solver of Clark et al","children":[],"payload":{"tag":"li","lines":"3807,3808"}},{"content":"(2016)","children":[],"payload":{"tag":"li","lines":"3808,3809"}},{"content":"Accuracy = 25.5 &#x2014; on OpenBookQA-Dev &#x2014; vs Guess All 25","children":[],"payload":{"tag":"li","lines":"3809,3810"}},{"content":"Accuracy = 24.8 &#x2014; on OpenBookQA-Test &#x2014; vs Guess All 25","children":[],"payload":{"tag":"li","lines":"3810,3811"}}],"payload":{"tag":"li","lines":"3806,3811"}},{"content":"Embeddings + Similarities","children":[{"content":"We first experiment with a simple logistic regression model (Mihaylov and Nakov, 2016","children":[],"payload":{"tag":"li","lines":"3812,3813"}},{"content":"Mihaylov and Frank, 2016, 2017) that uses centroid vectors r_s^{emb} of the word embeddings","children":[],"payload":{"tag":"li","lines":"3813,3814"}}],"payload":{"tag":"li","lines":"3811,3814"}},{"content":"ESIM","children":[{"content":"We also experiment with a model where r_q^{ctx} and r_{c_i}^{ctx} are obtained using token-wise interaction proposed in ESIM (Chen et al., 2017b)","children":[],"payload":{"tag":"li","lines":"3815,3816"}},{"content":"Accuracy = 53.9 &#x2014; on OpenBookQA-Dev &#x2014; vs Guess All 25","children":[],"payload":{"tag":"li","lines":"3816,3817"}},{"content":"Accuracy = 48.9 &#x2014; on OpenBookQA-Test &#x2014; vs Guess All 25","children":[],"payload":{"tag":"li","lines":"3817,3818"}},{"content":"Accuracy improvement = 1.8 &#x2014; on OpenBookQA-Test &#x2014; vs ESIM 48.9","children":[],"payload":{"tag":"li","lines":"3818,3819"}}],"payload":{"tag":"li","lines":"3814,3819"}},{"content":"Plausible Answer Detector","children":[{"content":"(a) Plausible Answer Detector","children":[],"payload":{"tag":"li","lines":"3820,3821"}},{"content":"This baseline goes to the extreme of completely ignoring q and trying to learn how plausible it is for c_i to be the correct answer","children":[],"payload":{"tag":"li","lines":"3821,3822"}}],"payload":{"tag":"li","lines":"3819,3822"}},{"content":"(+5 more)","children":[],"payload":{"tag":"li","lines":"3822,3823"}}],"payload":{"tag":"li","lines":"3784,3823"}},{"content":"Metric definition","children":[{"content":"accuracy","children":[{"content":"For each question","children":[],"payload":{"tag":"li","lines":"3825,3826"}},{"content":"a solver receives 1 point towards this score if it chooses the correct answer","children":[],"payload":{"tag":"li","lines":"3826,3827"}},{"content":"and 1/k if it reports a k-way tie that includes the correct answer","children":[],"payload":{"tag":"li","lines":"3827,3828"}}],"payload":{"tag":"li","lines":"3824,3828"}},{"content":"standard deviation across 5 random seeds","children":[{"content":"Scores obtained by various solvers on Open-BookQA","children":[],"payload":{"tag":"li","lines":"3829,3830"}},{"content":"reported as a percentage &#xb1; the standard deviation across 5 runs with different random seeds","children":[],"payload":{"tag":"li","lines":"3830,3831"}}],"payload":{"tag":"li","lines":"3828,3831"}}],"payload":{"tag":"li","lines":"3823,3831"}},{"content":"Limitations","children":[{"content":"Restricted to elementary-level science multiple-choice questions","children":[{"content":"does not test free-form generation","children":[],"payload":{"tag":"li","lines":"3833,3834"}},{"content":"dialogue","children":[],"payload":{"tag":"li","lines":"3834,3835"}},{"content":"or multilingual settings","children":[],"payload":{"tag":"li","lines":"3835,3836"}}],"payload":{"tag":"li","lines":"3832,3836"}},{"content":"Open book F (1,326 facts) is small and curated","children":[{"content":"method does not scale-test retrieval over web-scale or noisy corpora","children":[],"payload":{"tag":"li","lines":"3837,3838"}}],"payload":{"tag":"li","lines":"3836,3838"}},{"content":"Best system needs gold oracle facts (f and k) to reach 76.9%","children":[{"content":"realistic retrieval is left as an open challenge","children":[],"payload":{"tag":"li","lines":"3839,3840"}}],"payload":{"tag":"li","lines":"3838,3840"}},{"content":"No evaluation on instruction-tuned LLMs","children":[{"content":"transformer-based models","children":[],"payload":{"tag":"li","lines":"3841,3842"}},{"content":"or modern pre-trained language models (paper predates BERT-era systems)","children":[],"payload":{"tag":"li","lines":"3842,3843"}}],"payload":{"tag":"li","lines":"3840,3843"}}],"payload":{"tag":"li","lines":"3831,3843"}}],"payload":{"tag":"li","lines":"3754,3843"}},{"content":"RP04 &#x2014; Clark et al. 2019 &#x2014; BoolQ &#x2014; naturally occurring yes/no","children":[{"content":"Year &#x2014; 2019","children":[],"payload":{"tag":"li","lines":"3844,3845"}},{"content":"Paper","children":[{"content":"Clark","children":[],"payload":{"tag":"li","lines":"3846,3847"}},{"content":"BoolQ: Exploring the Surprising Difficulty of Natural Yes/No Questions","children":[],"payload":{"tag":"li","lines":"3847,3848"}}],"payload":{"tag":"li","lines":"3845,3848"}},{"content":"Contribution","children":[{"content":"naturally occurring yes/no","children":[],"payload":{"tag":"li","lines":"3849,3850"}},{"content":"BoolQ is a reading comprehension dataset of 16,000 naturally occurring yes/no questions paired with Wikipedia passages","children":[],"payload":{"tag":"li","lines":"3850,3851"}},{"content":"used to test inferential abilities of QA models","children":[],"payload":{"tag":"li","lines":"3851,3852"}}],"payload":{"tag":"li","lines":"3848,3852"}},{"content":"Dataset","children":[{"content":"BoolQ","children":[{"content":"to gather 16,000 naturally occurring yes/no questions into a dataset we call BoolQ (for Boolean Questions)","children":[],"payload":{"tag":"li","lines":"3854,3855"}},{"content":"Each question is paired with a paragraph from Wikipedia","children":[],"payload":{"tag":"li","lines":"3855,3856"}}],"payload":{"tag":"li","lines":"3853,3856"}},{"content":"MultiNLI","children":[{"content":"Entailment: We consider two entailment datasets, <em>MultiNLI</em> ((Williams et al.,)(#page-10-11) (2018))(#page-10-11) and <em>SNLI</em>","children":[],"payload":{"tag":"li","lines":"3857,3858"}}],"payload":{"tag":"li","lines":"3856,3858"}},{"content":"SNLI","children":[{"content":"Entailment: We consider two entailment datasets, <em>MultiNLI</em> ((Williams et al.,)(#page-10-11) (2018))(#page-10-11) and <em>SNLI</em> ((Bowman et al.,)(#page-9-11) (2015))(#page-9-11)","children":[],"payload":{"tag":"li","lines":"3859,3860"}}],"payload":{"tag":"li","lines":"3858,3860"}},{"content":"RACE","children":[{"content":"Multiple-Choice QA: We use a multiple choice reading comprehension dataset, <em>RACE</em> ((Lai et al.,)(#page-9-19) (2017))(#page-9-19)","children":[],"payload":{"tag":"li","lines":"3861,3862"}}],"payload":{"tag":"li","lines":"3860,3862"}},{"content":"QNLI","children":[{"content":"First","children":[],"payload":{"tag":"li","lines":"3863,3864"}},{"content":"we use the <em>QNLI</em> task from GLUE ((Wang)(#page-10-3) (et al.,)(#page-10-3) (2018))(#page-10-3)","children":[],"payload":{"tag":"li","lines":"3864,3865"}},{"content":"where the model must determine if a sentence from SQuAD 1.1","children":[],"payload":{"tag":"li","lines":"3865,3866"}}],"payload":{"tag":"li","lines":"3862,3866"}},{"content":"SQuAD 2.0","children":[{"content":"we also try building entailment-like training data from <em>SQuAD 2.0</em> ((Rajpurkar et al.,)(#page-10-13) (2018))(#page-10-13)","children":[],"payload":{"tag":"li","lines":"3867,3868"}}],"payload":{"tag":"li","lines":"3866,3868"}},{"content":"Natural Questions","children":[{"content":"Finally","children":[],"payload":{"tag":"li","lines":"3869,3870"}},{"content":"we also experiment with leveraging the long-answer portion of NQ","children":[],"payload":{"tag":"li","lines":"3870,3871"}},{"content":"where models must select a paragraph containing the answer to a question from a document","children":[],"payload":{"tag":"li","lines":"3871,3872"}}],"payload":{"tag":"li","lines":"3868,3872"}},{"content":"QQP","children":[{"content":"Paraphrasing: We use the Quora Question Paraphrasing (<em>QQP</em>) dataset","children":[],"payload":{"tag":"li","lines":"3873,3874"}},{"content":"which consists of pairs of questions labelled as being paraphrases or not","children":[],"payload":{"tag":"li","lines":"3874,3875"}}],"payload":{"tag":"li","lines":"3872,3875"}},{"content":"Y/N MS Marco","children":[{"content":"Heuristic Yes/No: We attempt to heuristically construct a corpus of yes/no questions from the MS Marco corpus ((Nguyen et al.,)(#page-9-7) (2016))(#page-9-7)","children":[],"payload":{"tag":"li","lines":"3876,3877"}}],"payload":{"tag":"li","lines":"3875,3877"}}],"payload":{"tag":"li","lines":"3852,3877"}},{"content":"Data Size","children":[{"content":"16,000 naturally occurring yes/no questions: 9.4k train, 3.2k dev, 3.2k test (avg question 8.9 tokens","children":[],"payload":{"tag":"li","lines":"38  &#x2014; on BoolQ &#x2014; vs Majority 62.17","children":[],"payload":{"tag":"li","lines":"3894,3895"}},{"content":"Source Accuracy = 79.66 &#x2014; on QNLI","children":[],"payload":{"tag":"li","lines":"3895,3896"}},{"content":"Accuracy (dev) = 71.41 &#x2014; on BoolQ &#x2014; vs Majority 62.17","children":[],"payload":{"tag":"li","lines":"3896,3897"}},{"content":"Accuracy (dev) = 76.15 &#x2014; on BoolQ &#x2014; vs Recurrent 70.28","children":[],"payload":{"tag":"li","lines":"3897,3898"}},{"content":"Accuracy (test) = 74.24 &#x2014; on BoolQ &#x2014; vs Recurrent 67.52","children":[],"payload":{"tag":"li","lines":"3898,3899"}}],"payload":{"tag":"li","lines":"3891,3899"}},{"content":"OpenAI GPT","children":[{"content":"Our <em>OpenAI GPT</em> model fine-tunes the 12 layer 768 dimensional uni-directional transformer","children":[],"payload":{"tag":"li","lines":"3900,3901"}},{"content":"Accuracy (dev) = 72.87 &#x2014; on BoolQ &#x2014; vs Majority 62.17","children":[],"payload":{"tag":"li","lines":"3901,3902"}}],"payload":{"tag":"li","lines":"3899,3902"}},{"content":"BERT-Large","children":[{"content":"Our <em>BERT</em>*^(L)* model fine-tunes the 24 layer 1024 dimensional transformer from (Devlin et al.)(#page-9-5) ((2018))(#page-9-5)","children":[],"payload":{"tag":"li","lines":"3903,3904"}},{"content":"Accuracy (test) = 80.43 &#x2014; on BoolQ &#x2014; vs Human 90","children":[],"payload":{"tag":"li","lines":"3904,3905"}},{"content":"Accuracy (dev) = 82.2 &#x2014; on BoolQ &#x2014; vs BERT-Large 78.09","children":[],"payload":{"tag":"li","lines":"3905,3906"}},{"content":"Accuracy (test) = 76.7 &#x2014; on BoolQ &#x2014; vs Majority 62.31","children":[],"payload":{"tag":"li","lines":"3906,3907"}},{"content":"Accuracy (dev) = 64.48 &#x2014; on BoolQ &#x2014; vs Majority 62.17","children":[],"payload":{"tag":"li","lines":"3907,3908"}},{"content":"Accuracy (dev) = 66.74 &#x2014; on BoolQ &#x2014; vs Majority 62.17","children":[],"payload":{"tag":"li","lines":"3908,3909"}},{"content":"Accuracy (dev) = 78.43 &#x2014; on BoolQ &#x2014; vs BERT-Large + MultiNLI 82.2","children":[],"payload":{"tag":"li","lines":"3909,3910"}}],"payload":{"tag":"li","lines":"3902,3910"}}],"payload":{"tag":"li","lines":"3881,3910"}},{"content":"Metric definition","children":[{"content":"accuracy","children":[{"content":"It achieves 80.4% accuracy compared to 90% accuracy of human annotators (and 62% majority-baseline)","children":[],"payload":{"tag":"li","lines":"3912,3913"}}],"payload":{"tag":"li","lines":"3911,3913"}}],"payload":{"tag":"li","lines":"3910,3913"}},{"content":"Limitations","children":[{"content":"Each question is paired with one selected passage rather than a full document","children":[{"content":"which limits document-level reasoning study","children":[],"payload":{"tag":"li","lines":"3915,3916"}}],"payload":{"tag":"li","lines":"3914,3916"}},{"content":"Best model still trails human accuracy by about 10 points","children":[{"content":"leaving a significant gap for future work","children":[],"payload":{"tag":"li","lines":"3917,3918"}}],"payload":{"tag":"li","lines":"3916,3918"}},{"content":"Restricts questions to those whose first word is in a manual indicator-word list","children":[{"content":"possibly excluding rarer yes/no patterns","children":[],"payload":{"tag":"li","lines":"3919,3920"}}],"payload":{"tag":"li","lines":"3918,3920"}}],"payload":{"tag":"li","lines":"3913,3920"}}],"payload":{"tag":"li","lines":"3843,3920"}},{"content":"RP05 &#x2014; Zellers et al. 2019 &#x2014; HellaSwag &#x2014; adversarially filtered commonsense NLI","children":[{"content":"Year &#x2014; 2019","children":[],"payload":{"tag":"li","lines":"3921,3922"}},{"content":"Paper","children":[{"content":"Zellers","children":[],"payload":{"tag":"li","lines":"3923,3924"}},{"content":"HellaSwag: Can a Machine Really Finish Your Sentence?","children":[],"payload":{"tag":"li","lines":"3924,3925"}}],"payload":{"tag":"li","lines":"3922,3925"}},{"content":"Contribution","children":[{"content":"adversarially filtered commonsense NLI","children":[],"payload":{"tag":"li","lines":"3926,3927"}},{"content":"HellaSwag is a 70k-question commonsense NLI benchmark built via Adversarial Filtering (AF) with GPT generations and BERT discriminators","children":[],"payload":{"tag":"li","lines":"3927,3928"}},{"content":"it is easy for humans (&gt;95%) but hard for state-of-the-art models (&lt;48%)","children":[],"payload":{"tag":"li","lines":"3928,3929"}}],"payload":{"tag":"li","lines":"3925,3929"}},{"content":"Dataset","children":[{"content":"HellaSwag","children":[{"content":"We use Adversarial Filtering (AF)","children":[],"payload":{"tag":"li","lines":"3931,3932"}},{"content":"a data-collection paradigm in which a series of discriminators is used to select a challenging set of generated wrong answers","children":[],"payload":{"tag":"li","lines":"3932,3933"}},{"content":"AF is surprisingly effective towards this goal: the resulting dataset of 70k problems is easy for humans (95.6% accuracy)","children":[],"payload":{"tag":"li","lines":"3933,3934"}},{"content":"yet challenging for machines (&lt;50%)","children":[],"payload":{"tag":"li","lines":"3934,3935"}}],"payload":{"tag":"li","lines":"3930,3935"}},{"content":"ActivityNet Captions","children":[{"content":"We start by including video captions from the ActivityNet Captions dataset (Krishna et al., 2017)","children":[],"payload":{"tag":"li","lines":"3936,3937"}}],"payload":{"tag":"li","lines":"3935,3937"}},{"content":"WikiHow","children":[{"content":"We next consider a new and challenging testbed for commonsense reasoning: completing how-to articles from WikiHow","children":[],"payload":{"tag":"li","lines":"3938,3939"}},{"content":"an online how-to manual","children":[],"payload":{"tag":"li","lines":"3939,3940"}},{"content":"We scrape 80k context and follow-up paragraphs from WikiHow","children":[],"payload":{"tag":"li","lines":"3940,3941"}}],"payload":{"tag":"li","lines":"3937,3941"}},{"content":"SWAG","children":[{"content":"SWAG is a dataset for commonsense NLI","children":[],"payload":{"tag":"li","lines":"3942,3943"}},{"content":"For each question","children":[],"payload":{"tag":"li","lines":"3943,3944"}},{"content":"a model is given a <strong>context</strong> from a video caption and four <strong>ending choices</strong> for what might happen next","children":[],"payload":{"tag":"li","lines":"3944,3945"}}],"payload":{"tag":"li","lines":"3941,3945"}}],"payload":{"tag":"li","lines":"3929,3945"}},{"content":"Data Size","children":[{"content":"70k problems total: 25k ActivityNet contexts and 45k WikiHow contexts","children":[],"payload":{"tag":"li","lines":"3946,3947"}},{"content":"10K validation and 10K test (5k in-domain + 5k zero-shot each)","children":[],"payload":{"tag":"li","lines":"3947,3948"}}],"payload":{"tag":"li","lines":"3945,3948"}},{"content":"Models","children":[{"content":"BERT-Large","children":[{"content":"/ BERT-Large / <strong>46.7</strong> / <strong>47.3</strong> / <strong>50.2</strong> / <strong>49.7</strong> / <strong>43.3</strong> / <strong>45.0</strong> / <strong>54.7</strong> / <strong>51.7</strong> / <strong>42.9</strong> / <strong>45.0</strong> /","children":[],"payload":{"tag":"li","lines":"3950,3951"}},{"content":"Accuracy = 47.3 &#x2014; on HellaSwag &#x2014; vs Human 95.6","children":[],"payload":{"tag":"li","lines":"3951,3952"}},{"content":"Accuracy = 45 &#x2014; on WikiHow &#x2014; vs Human 96.5","children":[],"payload":{"tag":"li","lines":"3952,3953"}},{"content":"Accuracy = 46.7 &#x2014; on HellaSwag &#x2014; vs Human 95.7","children":[],"payload":{"tag":"li","lines":"3953,3954"}}],"payload":{"tag":"li","lines":"3949,3954"}},{"content":"BERT-Base","children":[{"content":"Accuracy = 35.9 &#x2014; on HellaSwag","children":[],"payload":{"tag":"li","lines":"3955,3956"}},{"content":"Accuracy = 36.2 &#x2014; on HellaSwag","children":[],"payload":{"tag":"li","lines":"3956,3957"}},{"content":"Accuracy = 38.7 &#x2014; on HellaSwag In-Domain","children":[],"payload":{"tag":"li","lines":"3957,3958"}},{"content":"Accuracy = 39.5 &#x2014; on HellaSwag","children":[],"payload":{"tag":"li","lines":"3958,3959"}},{"content":"Accuracy = 40.5 &#x2014; on HellaSwag","children":[],"payload":{"tag":"li","lines":"3959,3960"}},{"content":"Accuracy = 42.9 &#x2014; on HellaSwag In-Domain","children":[],"payload":{"tag":"li","lines":"3960,3961"}}],"payload":{"tag":"li","lines":"3954,3961"}},{"content":"OpenAI GPT","children":[{"content":"Accuracy = 41.9 &#x2014; on HellaSwag","children":[],"payload":{"tag":"li","lines":"3962,3963"}},{"content":"Accuracy = 41.7 &#x2014; on HellaSwag","children":[],"payload":{"tag":"li","lines":"3963,3964"}},{"content":"Accuracy = 45.3 &#x2014; on HellaSwag In-Domain","children":[],"payload":{"tag":"li","lines":"3964,3965"}}],"payload":{"tag":"li","lines":"3961,3965"}},{"content":"ESIM+ELMo","children":[{"content":"Accuracy = 33.3 &#x2014; on HellaSwag","children":[],"payload":{"tag":"li","lines":"3966,3967"}},{"content":"Accuracy = 33.6 &#x2014; on HellaSwag","children":[],"payload":{"tag":"li","lines":"3967,3968"}},{"content":"Accuracy = 35.7 &#x2014; on HellaSwag In-Domain","children":[],"payload":{"tag":"li","lines":"3968,3969"}}],"payload":{"tag":"li","lines":"3965,3969"}},{"content":"LSTM+BERT-Base","children":[{"content":"Accuracy = 35.9 &#x2014; on HellaSwag","children":[],"payload":{"tag":"li","lines":"3970,3971"}},{"content":"Accuracy = 36.2 &#x2014; on HellaSwag","children":[],"payload":{"tag":"li","lines":"3971,3972"}},{"content":"Accuracy = 38.7 &#x2014; on HellaSwag In-Domain","children":[],"payload":{"tag":"li","lines":"3972,3973"}},{"content":"Accuracy = 39.5 &#x2014; on HellaSwag","children":[],"payload":{"tag":"li","lines":"3973,3974"}},{"content":"Accuracy = 40.5 &#x2014; on HellaSwag","children":[],"payload":{"tag":"li","lines":"3974,3975"}},{"content":"Accuracy = 42.9 &#x2014; on HellaSwag In-Domain","children":[],"payload":{"tag":"li","lines":"3975,3976"}}
